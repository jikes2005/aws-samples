AWSTemplateFormatVersion: "2010-09-09"
Description: >
  AgentCore POC (single stack). Uses an EXISTING VPC, subnets and VPC endpoints.
  Strands agent on AgentCore Runtime -> AgentCore Gateway (MCP) -> tool Lambda ->
  private API Gateway (Cognito M2M authorizer) -> Lambda -> DynamoDB.
  Custom resources create the Cognito app client (ALLOW_CLIENT_TOKEN_AUTH), seed sample data
  and take an on-demand DynamoDB backup. A customer managed KMS key encrypts every resource
  that supports one.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: Existing network }
        Parameters: [VpcId, PrivateSubnetIds, ExecuteApiVpceId]
      - Label: { default: Agent }
        Parameters: [ArtifactBucket, AgentCodeKey, ModelId]
      - Label: { default: "Encryption, backup and API controls" }
        Parameters: [ExistingKmsKeyArn, CreateApiGatewayAccountRole, TestFunctionInVpc]
      - Label: { default: Required tags }
        Parameters: [AppCatID, ServiceName, SupportTeam, Environment]
      - Label: { default: General }
        Parameters: [ProjectName, StageName]

Parameters:
  ProjectName:
    Type: String
    Default: agentcore-poc
    AllowedPattern: "^[a-z][a-z0-9-]{2,29}$"
  StageName:
    Type: String
    Default: dev
  VpcId:
    Type: AWS::EC2::VPC::Id
  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Existing private subnets (2+ AZs) for Lambdas and AgentCore Runtime ENIs
  ExecuteApiVpceId:
    Type: String
    AllowedPattern: "^vpce-[0-9a-f]+$"
    Description: Existing execute-api interface endpoint ID (private API is pinned to it)
  ArtifactBucket:
    Type: String
    Description: Existing S3 bucket holding the agent code zip
  AgentCodeKey:
    Type: String
    Description: S3 key of the agent zip. A new key forces a runtime update.
  ModelId:
    Type: String
    Default: us.anthropic.claude-sonnet-4-5-20250929-v1:0
    Description: Bedrock model or inference-profile ID enabled in this account/region
  ExistingKmsKeyArn:
    Type: String
    Default: ""
    AllowedPattern: "^$|^arn:aws[a-z-]*:kms:[a-z0-9-]+:[0-9]{12}:key/[a-f0-9-]{36}$"
    Description: >
      Leave blank to create a customer managed key for this stack. To use an existing CMK,
      give its key ARN (not an alias) and add the key policy statements from the README.
  TestFunctionInVpc:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: >
      Run the agent test Lambda in the VPC. Needs the AgentCore data-plane interface
      endpoint (com.amazonaws.<region>.bedrock-agentcore). Set false if the VPC doesn't have it.
  CreateApiGatewayAccountRole:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"
    Description: >
      API Gateway access logging needs a CloudWatch Logs role in the account-level API Gateway
      settings (one per account and region). Set true ONLY if the account has none - this
      overwrites the existing account setting.

  # ---- Required tags ----
  AppCatID:
    Type: String
    MinLength: 1
    Default: 12345
  ServiceName:
    Type: String
    Default: AgentCore POC
    MinLength: 1
  SupportTeam:
    Type: String
    MinLength: 1
    Default: "CLOUD"
  Environment:
    Type: String
    Default: dev
    MinLength: 1

Conditions:
  CreateKmsKey: !Equals [!Ref ExistingKmsKeyArn, ""]
  CreateApiGwAccount: !Equals [!Ref CreateApiGatewayAccountRole, "true"]
  TestFnInVpc: !Equals [!Ref TestFunctionInVpc, "true"]

Resources:
  # =====================================================================
  # Customer managed KMS key - used by DynamoDB (incl. its backups), CloudWatch log
  # groups (incl. API access logs), Lambda environment variables and the
  # AgentCore Gateway. Skipped when ExistingKmsKeyArn is set.
  # The gateway service role gets key use through an IAM policy (GatewayKmsPolicy),
  # enabled by the EnableIamPolicies statement.
  # =====================================================================
  KmsKey:
    Type: AWS::KMS::Key
    Condition: CreateKmsKey
    DeletionPolicy: Delete             # stack delete schedules key deletion (7-day minimum KMS wait)
    UpdateReplacePolicy: Delete
    Properties:
      Tags:
        - Key: AppCatID
          Value: !Ref AppCatID
        - Key: Description
          Value: "CMK for data at rest"
        - Key: ServiceName
          Value: !Ref ServiceName
        - Key: Support-Team
          Value: !Ref SupportTeam
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectName
      Description: !Sub "${ProjectName} - CMK for data at rest"
      EnableKeyRotation: true
      PendingWindowInDays: 7
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: EnableIamPolicies
            Effect: Allow
            Principal: { AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root" }
            Action: kms:*
            Resource: "*"
          - Sid: CloudWatchLogs
            Effect: Allow
            Principal: { Service: !Sub "logs.${AWS::Region}.amazonaws.com" }
            Action: [kms:Encrypt*, kms:Decrypt*, kms:ReEncrypt*, kms:GenerateDataKey*, kms:Describe*]
            Resource: "*"
            Condition:
              ArnLike:
                kms:EncryptionContext:aws:logs:arn: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:*"

  KmsKeyAlias:
    Type: AWS::KMS::Alias
    Condition: CreateKmsKey
    Properties:
      AliasName: !Sub "alias/${ProjectName}"
      TargetKeyId: !Ref KmsKey

  # =====================================================================
  # Network (existing VPC) - only the workload security group is created
  # =====================================================================
  WorkloadSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      Tags:
        - Key: AppCatID
          Value: !Ref AppCatID
        - Key: Description
          Value: "Workload SG for Lambdas and AgentCore Runtime"
        - Key: ServiceName
          Value: !Ref ServiceName
        - Key: Support-Team
          Value: !Ref SupportTeam
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectName
        - Key: Name
          Value: !Sub "${ProjectName}-workload-sg"
      GroupDescription: !Sub "${ProjectName} workloads (Lambda, AgentCore Runtime)"
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS to VPC endpoints

  # =====================================================================
  # DynamoDB
  # =====================================================================
  CustomersTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete          # deleted with the stack (TableDeletionGuard lifts deletion protection first)
    UpdateReplacePolicy: Delete
    Properties:
      Tags:
        - Key: AppCatID
          Value: !Ref AppCatID
        - Key: Description
          Value: "Customer records for the sample API"
        - Key: dynamodbbackup          # DDB.11 - org backup policy; literal so the hook can read it
          Value: "True"
        - Key: ServiceName
          Value: !Ref ServiceName
        - Key: Support-Team
          Value: !Ref SupportTeam
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectName
      TableName: !Sub "${ProjectName}-customers"
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true   # disable before deleting the stack (see README)
      AttributeDefinitions:
        - { AttributeName: customerId, AttributeType: S }
        - { AttributeName: email, AttributeType: S }
      KeySchema:
        - { AttributeName: customerId, KeyType: HASH }
      GlobalSecondaryIndexes:
        - IndexName: email-index
          KeySchema:
            - { AttributeName: email, KeyType: HASH }
          Projection:
            ProjectionType: KEYS_ONLY
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !If [CreateKmsKey, !GetAtt KmsKey.Arn, !Ref ExistingKmsKeyArn]

  # =====================================================================
  # Cognito (machine-to-machine). No user pool domain on purpose: a domain
  # blocks user pool requests through the cognito-idp VPC endpoint. Tokens
  # are issued with the GetClientToken API instead of /oauth2/token.
  # =====================================================================
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolTags:
        AppCatID: !Ref AppCatID
        Description: "Cognito user pool for M2M API auth"
        ServiceName: !Ref ServiceName
        Support-Team: !Ref SupportTeam
        Environment: !Ref Environment
        Project: !Ref ProjectName
      UserPoolName: !Sub "${ProjectName}-pool"
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true

  ResourceServer:
    Type: AWS::Cognito::UserPoolResourceServer
    Properties:
      UserPoolId: !Ref UserPool
      Identifier: customer-api
      Name: Customer API
      Scopes:
        - { ScopeName: customers.read, ScopeDescription: Read customers }
        - { ScopeName: customers.write, ScopeDescription: Create customers }

  # =====================================================================
  # Deploy-time helper Lambda for both custom resources
  #   Custom::CognitoM2MClient - app client with ALLOW_CLIENT_TOKEN_AUTH, which
  #       AWS::Cognito::UserPoolClient doesn't accept yet. Ref = client ID.
  #   Custom::SeedCustomers   - writes sample customers (never overwrites).
  # =====================================================================
  DeployHelperRole:
    Type: AWS::IAM::Role
    Properties:
      Tags:
        - Key: AppCatID
          Value: !Ref AppCatID
        - Key: Description
          Value: "Role for deploy-time custom resources"
        - Key: ServiceName
          Value: !Ref ServiceName
        - Key: Support-Team
          Value: !Ref SupportTeam
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectName
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: deploy-helper
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - cognito-idp:CreateUserPoolClient
                  - cognito-idp:UpdateUserPoolClient
                  - cognito-idp:DeleteUserPoolClient
                  - cognito-idp:DescribeUserPoolClient
                Resource: !GetAtt UserPool.Arn
              - Effect: Allow
                Action: [dynamodb:PutItem, dynamodb:CreateBackup, dynamodb:UpdateTable, dynamodb:DescribeTable]
                Resource: !GetAtt CustomersTable.Arn
              - Effect: Allow
                Action: dynamodb:DeleteBackup
                Resource: !Sub "${CustomersTable.Arn}/backup/*"
              - Sid: RuntimeLogCleanup
                Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: "*"
              - Sid: RuntimeLogCleanupDelete
                Effect: Allow
                Action: logs:DeleteLogGroup
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/runtimes/*"
              - Sid: UseCmkViaDynamoDb
                Effect: Allow
                Action: [kms:Encrypt, kms:Decrypt, kms:ReEncrypt*, kms:GenerateDataKey*, kms:DescribeKey, kms:CreateGrant]
                Resource: !If [CreateKmsKey, !GetAtt KmsKey.Arn, !Ref ExistingKmsKeyArn]
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub "dynamodb.${AWS::Region}.amazonaws.com"
              - Sid: DecryptEnvVars
                Effect: Allow
                Action: kms:Decrypt
                Resource: !If [CreateKmsKey, !GetAtt KmsKey.Arn, !Ref ExistingKmsKeyArn]

  DeployHelperLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      Tags:
        - Key: AppCatID
          Value: !Ref AppCatID
        - Key: Description
          Value: "Logs for the deploy helper Lambda"
        - Key: ServiceName
          Value: !Ref ServiceName
        - Key: Support-Team
          Value: !Ref SupportTeam
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectName
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-deploy-helper"
      RetentionInDays: 14
      KmsKeyId: !If [CreateKmsKey, !GetAtt KmsKey.Arn, !Ref ExistingKmsKeyArn]

  DeployHelperFn:
    Type: AWS::Lambda::Function
    DependsOn: DeployHelperLogGroup
    Properties:
      Tags:
        - Key: AppCatID
          Value: !Ref AppCatID
        - Key: Description
          Value: "Deploy-time custom resources"
        - Key: ServiceName
          Value: !Ref ServiceName
        - Key: Support-Team
          Value: !Ref SupportTeam
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectName
      FunctionName: !Sub "${ProjectName}-deploy-helper"
      Description: CloudFormation custom resources (Cognito client, seed, backup, delete-time cleanup)
      Runtime: python3.12
      Architectures: [arm64]
      Handler: index.handler
      Timeout: 120
      MemorySize: 256
      Role: !GetAtt DeployHelperRole.Arn
      KmsKeyArn: !If [CreateKmsKey, !GetAtt KmsKey.Arn, !Ref ExistingKmsKeyArn]
      # Deliberately NOT in the VPC (same pattern as the RAG POC's schema-init Lambda).
      # It only runs at deploy time, calls Cognito and DynamoDB control-plane APIs, and must
      # PUT its result to CloudFormation's pre-signed S3 URL, which these private subnets
      # can't resolve. The org hook reports this as a warning (Lam.23), not an error.
      Code:
        ZipFile: |
          import json, re, time, threading, urllib.request
          from decimal import Decimal
          import boto3
          from botocore.exceptions import ClientError

          CLIENT_ID_RE = re.compile(r"^[a-z0-9]{20,128}$")

          def send(event, context, status, physical_id, data=None, reason=None):
              body = json.dumps({
                  "Status": status,
                  "Reason": (reason or f"See CloudWatch log stream {context.log_stream_name}")[:1000],
                  "PhysicalResourceId": physical_id,
                  "StackId": event["StackId"], "RequestId": event["RequestId"],
                  "LogicalResourceId": event["LogicalResourceId"],
                  "NoEcho": False, "Data": data or {},
              }).encode()
              req = urllib.request.Request(event["ResponseURL"], data=body, method="PUT",
                                           headers={"Content-Type": "", "Content-Length": str(len(body))})
              for attempt in range(5):
                  try:
                      with urllib.request.urlopen(req, timeout=15) as r:
                          print(f"CloudFormation response {status} -> HTTP {r.status}")
                          return
                  except Exception as e:
                      print(f"Failed to send CloudFormation response (attempt {attempt + 1}/5): {e}")
                      time.sleep(2)
              print("Gave up sending the CloudFormation response; the stack will wait for ServiceTimeout")

          # ---------- Custom::CognitoM2MClient ----------
          def _client_cfg(p):
              return dict(
                  UserPoolId=p["UserPoolId"], ClientName=p["ClientName"],
                  ExplicitAuthFlows=["ALLOW_CLIENT_TOKEN_AUTH"],   # must be the only flow
                  AllowedOAuthFlows=["client_credentials"], AllowedOAuthFlowsUserPoolClient=True,
                  AllowedOAuthScopes=p["Scopes"],
                  AccessTokenValidity=int(p.get("AccessTokenValidityMinutes", 60)),
                  TokenValidityUnits={"AccessToken": "minutes"})

          def cognito_client(event):
              idp = boto3.client("cognito-idp")
              p, rtype = event["ResourceProperties"], event["RequestType"]
              old = event.get("OldResourceProperties", {})
              pid = event.get("PhysicalResourceId", "")

              if rtype == "Delete":
                  # Best effort: never block a stack delete. The client is a child of the user
                  # pool, so deleting the pool (which follows) removes it anyway.
                  if CLIENT_ID_RE.match(pid):
                      try:
                          idp.delete_user_pool_client(UserPoolId=p["UserPoolId"], ClientId=pid)
                          print(f"Deleted app client {pid}")
                      except Exception as e:
                          print(f"WARNING: could not delete app client {pid} ({type(e).__name__}: {e}); "
                                "it is removed with the user pool")
                  return pid, {}

              replace = rtype == "Create" or any(old.get(k) != p.get(k) for k in ("UserPoolId", "ClientName"))
              if replace:
                  # New physical ID -> CloudFormation deletes the old client after a successful update.
                  c = idp.create_user_pool_client(GenerateSecret=True, **_client_cfg(p))["UserPoolClient"]
              else:
                  c = idp.update_user_pool_client(ClientId=pid, **_client_cfg(p))["UserPoolClient"]
              # The secret is NOT returned to CloudFormation; consumers read it from Cognito.
              return c["ClientId"], {"ClientId": c["ClientId"]}

          # ---------- Custom::SeedCustomers ----------
          SEED = [
              {"customerId": "C-1001", "firstName": "Alice", "lastName": "Nguyen", "email": "alice.nguyen@example.com",
               "segment": "RETAIL", "status": "ACTIVE", "city": "Toronto", "province": "ON",
               "accounts": [{"type": "CHEQUING", "balance": Decimal("4520.15")},
                            {"type": "SAVINGS", "balance": Decimal("18200.00")}],
               "createdAt": "2021-03-14T10:22:00+00:00"},
              {"customerId": "C-1002", "firstName": "Brian", "lastName": "Okafor", "email": "brian.okafor@example.com",
               "segment": "SMALL_BUSINESS", "status": "ACTIVE", "city": "Calgary", "province": "AB",
               "accounts": [{"type": "BUSINESS_CHEQUING", "balance": Decimal("61234.90")}],
               "createdAt": "2019-11-02T15:05:00+00:00"},
              {"customerId": "C-1003", "firstName": "Chantal", "lastName": "Roy", "email": "chantal.roy@example.com",
               "segment": "WEALTH", "status": "DORMANT", "city": "Montreal", "province": "QC",
               "accounts": [{"type": "INVESTMENT", "balance": Decimal("250000.00")}],
               "createdAt": "2015-06-30T09:00:00+00:00"},
              {"customerId": "C-1004", "firstName": "Devon", "lastName": "Singh", "email": "devon.singh@example.com",
               "segment": "RETAIL", "status": "ACTIVE", "city": "Ottawa", "province": "ON",
               "accounts": [{"type": "CHEQUING", "balance": Decimal("812.40")},
                            {"type": "CREDIT_CARD", "balance": Decimal("-1290.55")}],
               "createdAt": "2023-08-21T13:40:00+00:00"},
          ]

          def seed(event):
              if event["RequestType"] == "Delete":
                  return event.get("PhysicalResourceId", "seed"), {}   # table is deleted with the stack
              table = boto3.resource("dynamodb").Table(event["ResourceProperties"]["TableName"])
              written = 0
              for item in SEED:
                  try:
                      table.put_item(Item=item, ConditionExpression="attribute_not_exists(customerId)")
                      written += 1
                  except ClientError as e:
                      if e.response["Error"]["Code"] != "ConditionalCheckFailedException":
                          raise
              return f"seed-{event['ResourceProperties']['TableName']}", {"Written": str(written)}

          # ---------- Custom::DynamoDbOnDemandBackup ----------
          def on_demand_backup(event):
              # Native DynamoDB on-demand backup (encrypted with the table's CMK). Taken on
              # create and whenever BackupVersion changes. Deleted on stack delete; when
              # BackupVersion changes, CloudFormation deletes the previous backup.
              p = event["ResourceProperties"]
              if event["RequestType"] == "Delete":
                  pid = event.get("PhysicalResourceId", "")
                  if pid.startswith("arn:"):
                      try:
                          boto3.client("dynamodb").delete_backup(BackupArn=pid)
                          print(f"Deleted backup {pid}")
                      except ClientError as e:
                          if e.response["Error"]["Code"] not in ("BackupNotFoundException", "ResourceNotFoundException"):
                              raise
                  return pid or "backup", {}
              old = event.get("OldResourceProperties", {})
              if event["RequestType"] == "Update" and old.get("BackupVersion") == p.get("BackupVersion"):
                  return event["PhysicalResourceId"], {}
              name = f"{p['TableName']}-ondemand-v{p.get('BackupVersion', '1')}"[:255]
              b = boto3.client("dynamodb").create_backup(TableName=p["TableName"], BackupName=name)
              arn = b["BackupDetails"]["BackupArn"]
              return arn, {"BackupArn": arn}

          # ---------- Custom::TableDeletionGuard ----------
          def table_deletion_guard(event):
              # Deletion protection stays ON for the table's life. This resource depends on
              # the table, so CloudFormation deletes it first: we turn protection off and
              # wait for ACTIVE so the table delete that follows succeeds.
              p = event["ResourceProperties"]
              pid = f"deletion-guard-{p['TableName']}"
              if event["RequestType"] != "Delete":
                  return pid, {}
              ddb = boto3.client("dynamodb")
              try:
                  ddb.update_table(TableName=p["TableName"], DeletionProtectionEnabled=False)
                  ddb.get_waiter("table_exists").wait(TableName=p["TableName"],
                                                      WaiterConfig={"Delay": 2, "MaxAttempts": 45})
                  print(f"Deletion protection disabled on {p['TableName']}")
              except ClientError as e:
                  if e.response["Error"]["Code"] != "ResourceNotFoundException":
                      raise
              return pid, {}

          # ---------- Custom::RuntimeLogCleanup ----------
          def runtime_log_cleanup(event):
              # AgentCore Runtime creates /aws/bedrock-agentcore/runtimes/<name>-<suffix>-<endpoint>
              # itself, so CloudFormation doesn't own it. The runtime depends on this resource,
              # so on stack delete this runs after the runtime is gone.
              p = event["ResourceProperties"]
              name = p["RuntimeName"]
              prefix = f"/aws/bedrock-agentcore/runtimes/{name}-"
              if event["RequestType"] != "Delete":
                  return f"log-cleanup-{name}", {"RuntimeName": name}
              logs = boto3.client("logs")
              for page in logs.get_paginator("describe_log_groups").paginate(logGroupNamePrefix=prefix):
                  for g in page["logGroups"]:
                      try:
                          logs.delete_log_group(logGroupName=g["logGroupName"])
                          print(f"Deleted log group {g['logGroupName']}")
                      except ClientError as e:
                          if e.response["Error"]["Code"] != "ResourceNotFoundException":
                              raise
              return event.get("PhysicalResourceId", f"log-cleanup-{name}"), {}

          HANDLERS = {"Custom::CognitoM2MClient": cognito_client, "Custom::SeedCustomers": seed,
                      "Custom::DynamoDbOnDemandBackup": on_demand_backup,
                      "Custom::TableDeletionGuard": table_deletion_guard,
                      "Custom::RuntimeLogCleanup": runtime_log_cleanup}

          def handler(event, context):
              safe = {k: v for k, v in event.items() if k != "ResponseURL"}
              print(json.dumps(safe))
              pid = event.get("PhysicalResourceId") or f"failed-{event['RequestId']}"
              done = threading.Event()

              def respond(status, physical_id, data=None, reason=None):
                  if done.is_set():
                      return
                  done.set()
                  send(event, context, status, physical_id, data, reason)

              # Safety net: always answer CloudFormation before Lambda kills the invocation.
              guard = threading.Timer(max(context.get_remaining_time_in_millis() / 1000 - 20, 1),
                                      lambda: respond("FAILED", pid, reason="Timed out - see deploy-helper logs"))
              guard.daemon = True
              guard.start()
              try:
                  new_pid, data = HANDLERS[event["ResourceType"]](event)
                  respond("SUCCESS", new_pid, data)
              except Exception as e:
                  print(f"ERROR {type(e).__name__}: {e}")
                  respond("FAILED", pid, reason=f"{type(e).__name__}: {e}")
              finally:
                  guard.cancel()

  CognitoM2MClient:
    Type: Custom::CognitoM2MClient
    DependsOn: ResourceServer          # scopes must exist before the client references them
    Properties:
      ServiceToken: !GetAtt DeployHelperFn.Arn
      ServiceTimeout: 300
      UserPoolId: !Ref UserPool
      ClientName: !Sub "${ProjectName}-mcp-tools"
      Scopes:
        - customer-api/customers.read
        - customer-api/customers.write
      AccessTokenValidityMinutes: "60"

  SeedCustomers:
    Type: Custom::SeedCustomers
    Properties:
      ServiceToken: !GetAtt DeployHelperFn.Arn
      ServiceTimeout: 300
      TableName: !Ref CustomersTable
      SeedVersion: "1"                 # bump to re-run (existing IDs are never overwritten)

  # Deletes the runtime's service-created log group (/aws/bedrock-agentcore/runtimes/<name>-*)
  # after the runtime itself is deleted. It also supplies the runtime name (GetAtt RuntimeName).
  RuntimeLogCleanup:
    Type: Custom::RuntimeLogCleanup
    Properties:
      ServiceToken: !GetAtt DeployHelperFn.Arn
      ServiceTimeout: 300
      RuntimeName: !Join ["_", !Split ["-", !Sub "${ProjectName}_agent"]]

  # Created right after the table, so it also covers a rollback of a failed create.
  TableDeletionGuard:
    Type: Custom::TableDeletionGuard
    Properties:
      ServiceToken: !GetAtt DeployHelperFn.Arn
      ServiceTimeout: 300
      TableName: !Ref CustomersTable

  OnDemandBackup:
    Type: Custom::DynamoDbOnDemandBackup
    DependsOn: SeedCustomers
    Properties:
      ServiceToken: !GetAtt DeployHelperFn.Arn
      ServiceTimeout: 300
      TableName: !Ref CustomersTable
      BackupVersion: "1"               # bump to take another on-demand backup

  # =====================================================================
  # Customer API Lambda (DynamoDB CRUD)
  # =====================================================================
  CustomerApiFnRole:
    Type: AWS::IAM::Role
    Properties:
      Tags:
        - Key: AppCatID
          Value: !Ref AppCatID
        - Key: Description
          Value: "Role for the customer API Lambda"
        - Key: ServiceName
          Value: !Ref ServiceName
        - Key: Support-Team
          Value: !Ref SupportTeam
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectName
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: customers-table
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:Scan, dynamodb:Query]
                Resource:
                  - !GetAtt CustomersTable.Arn
                  - !Sub "${CustomersTable.Arn}/index/*"
              - Sid: UseCmkViaDynamoDb
                Effect: Allow
                Action: [kms:Encrypt, kms:Decrypt, kms:ReEncrypt*, kms:GenerateDataKey*, kms:DescribeKey, kms:CreateGrant]
                Resource: !If [CreateKmsKey, !GetAtt KmsKey.Arn, !Ref ExistingKmsKeyArn]
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub "dynamodb.${AWS::Region}.amazonaws.com"
              - Sid: DecryptEnvVars
                Effect: Allow
                Action: kms:Decrypt
                Resource: !If [CreateKmsKey, !GetAtt KmsKey.Arn, !Ref ExistingKmsKeyArn]

  CustomerApiFnLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      Tags:
        - Key: AppCatID
          Value: !Ref AppCatID
        - Key: Description
          Value: "Logs for the customer API Lambda"
        - Key: ServiceName
          Value: !Ref ServiceName
        - Key: Support-Team
          Value: !Ref SupportTeam
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectName
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-customer-api"
      RetentionInDays: 14
      KmsKeyId: !If [CreateKmsKey, !GetAtt KmsKey.Arn, !Ref ExistingKmsKeyArn]

  CustomerApiFn:
    Type: AWS::Lambda::Function
    DependsOn: CustomerApiFnLogGroup
    Properties:
      Tags:
        - Key: AppCatID
          Value: !Ref AppCatID
        - Key: Description
          Value: "Customer API backend - DynamoDB CRUD"
        - Key: ServiceName
          Value: !Ref ServiceName
        - Key: Support-Team
          Value: !Ref SupportTeam
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectName
      FunctionName: !Sub "${ProjectName}-customer-api"
      Runtime: python3.12
      Architectures: [arm64]
      Handler: index.handler
      Timeout: 10
      MemorySize: 256
      Role: !GetAtt CustomerApiFnRole.Arn
      KmsKeyArn: !If [CreateKmsKey, !GetAtt KmsKey.Arn, !Ref ExistingKmsKeyArn]
      VpcConfig:
        SubnetIds: !Ref PrivateSubnetIds
        SecurityGroupIds: [!Ref WorkloadSecurityGroup]
      Environment:
        Variables:
          TABLE_NAME: !Ref CustomersTable
      Code:
        ZipFile: |
          import json, os, re, uuid, datetime
          from decimal import Decimal
          import boto3
          from boto3.dynamodb.conditions import Attr, Key

          table = boto3.resource("dynamodb").Table(os.environ["TABLE_NAME"])
          REQUIRED = ("firstName", "lastName", "email")
          SEGMENTS = {"RETAIL", "SMALL_BUSINESS", "WEALTH"}
          EMAIL_RE = re.compile(r"^[^@\s]+@[^@\s]+\.[^@\s]+$")
          CID_RE = re.compile(r"^C-[0-9A-F]{4,8}$")

          def _json(o):
              if isinstance(o, Decimal):
                  return int(o) if o == o.to_integral_value() else float(o)
              raise TypeError(type(o))

          def _resp(code, body):
              return {"statusCode": code,
                      "headers": {"Content-Type": "application/json"},
                      "body": json.dumps(body, default=_json)}

          def list_customers(qs):
              # POC: Scan + filter. Add GSIs for real access patterns.
              cond = None
              for key in ("status", "segment", "province"):
                  if qs.get(key):
                      c = Attr(key).eq(qs[key].upper())
                      cond = c if cond is None else cond & c
              kwargs = {"FilterExpression": cond} if cond is not None else {}
              items, resp = [], table.scan(**kwargs)
              items += resp["Items"]
              while "LastEvaluatedKey" in resp:
                  resp = table.scan(ExclusiveStartKey=resp["LastEvaluatedKey"], **kwargs)
                  items += resp["Items"]
              items.sort(key=lambda c: c["customerId"])
              return _resp(200, {"count": len(items), "items": items})

          def get_customer(cid):
              cid = (cid or "").upper()
              if not CID_RE.match(cid):
                  return _resp(400, {"message": "customerId must look like C-1001"})
              item = table.get_item(Key={"customerId": cid}).get("Item")
              return _resp(200, item) if item else _resp(404, {"message": f"Customer {cid} not found"})

          def create_customer(raw):
              try:
                  body = json.loads(raw or "{}")
              except json.JSONDecodeError:
                  return _resp(400, {"message": "Body must be valid JSON"})
              missing = [f for f in REQUIRED if not str(body.get(f, "")).strip()]
              if missing:
                  return _resp(400, {"message": f"Missing fields: {', '.join(missing)}"})
              email = body["email"].strip().lower()
              if not EMAIL_RE.match(email):
                  return _resp(400, {"message": "Invalid email"})
              segment = str(body.get("segment") or "RETAIL").upper()
              if segment not in SEGMENTS:
                  return _resp(400, {"message": f"segment must be one of {sorted(SEGMENTS)}"})
              if table.query(IndexName="email-index", KeyConditionExpression=Key("email").eq(email))["Items"]:
                  return _resp(409, {"message": f"A customer with email {email} already exists"})
              item = {
                  "customerId": f"C-{uuid.uuid4().hex[:6].upper()}",
                  "firstName": body["firstName"].strip(), "lastName": body["lastName"].strip(),
                  "email": email, "segment": segment, "status": "PENDING_KYC",
                  "accounts": [],
                  "createdAt": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds"),
              }
              for opt in ("city", "province"):
                  if body.get(opt):
                      item[opt] = str(body[opt]).strip().upper() if opt == "province" else str(body[opt]).strip()
              table.put_item(Item=item, ConditionExpression="attribute_not_exists(customerId)")
              return _resp(201, item)

          def handler(event, context):
              claims = (event.get("requestContext", {}).get("authorizer") or {}).get("claims", {})
              print(json.dumps({"method": event.get("httpMethod"), "resource": event.get("resource"),
                                "client_id": claims.get("client_id"), "scope": claims.get("scope")}))
              method, resource = event.get("httpMethod"), event.get("resource")
              try:
                  if method == "GET" and resource == "/customers":
                      return list_customers(event.get("queryStringParameters") or {})
                  if method == "GET" and resource == "/customers/{customerId}":
                      return get_customer((event.get("pathParameters") or {}).get("customerId"))
                  if method == "POST" and resource == "/customers":
                      return create_customer(event.get("body"))
                  return _resp(405, {"message": f"{method} {resource} not supported"})
              except Exception as e:
                  print(f"ERROR {type(e).__name__}: {e}")
                  return _resp(500, {"message": "Internal error"})

  # =====================================================================
  # API Gateway (private REST + Cognito authorizer)
  # =====================================================================
  CustomerApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Tags:
        - Key: AppCatID
          Value: !Ref AppCatID
        - Key: Description
          Value: "Private customer REST API"
        - Key: ServiceName
          Value: !Ref ServiceName
        - Key: Support-Team
          Value: !Ref SupportTeam
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectName
      Name: !Sub "${ProjectName}-customer-api"
      Description: Private customer API (Cognito-protected) for the AgentCore POC
      EndpointConfiguration:
        Types: [PRIVATE]
        VpcEndpointIds: [!Ref ExecuteApiVpceId]
      Policy:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: execute-api:Invoke
            Resource: execute-api:/*
          - Effect: Deny
            Principal: "*"
            Action: execute-api:Invoke
            Resource: execute-api:/*
            Condition:
              StringNotEquals:
                aws:SourceVpce: !Ref ExecuteApiVpceId

  CognitoAuthorizer:
    Type: AWS::ApiGateway::Authorizer
    Properties:
      Name: cognito-m2m
      RestApiId: !Ref CustomerApi
      Type: COGNITO_USER_POOLS
      IdentitySource: method.request.header.Authorization
      ProviderARNs: [!GetAtt UserPool.Arn]

  CustomersResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CustomerApi
      ParentId: !GetAtt CustomerApi.RootResourceId
      PathPart: customers

  CustomerIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CustomerApi
      ParentId: !Ref CustomersResource
      PathPart: "{customerId}"

  ListCustomersMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CustomerApi
      ResourceId: !Ref CustomersResource
      HttpMethod: GET
      AuthorizationType: COGNITO_USER_POOLS
      AuthorizerId: !Ref CognitoAuthorizer
      AuthorizationScopes: [customer-api/customers.read]
      RequestParameters:
        method.request.querystring.status: false
        method.request.querystring.segment: false
        method.request.querystring.province: false
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CustomerApiFn.Arn}/invocations"

  CreateCustomerMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CustomerApi
      ResourceId: !Ref CustomersResource
      HttpMethod: POST
      AuthorizationType: COGNITO_USER_POOLS
      AuthorizerId: !Ref CognitoAuthorizer
      AuthorizationScopes: [customer-api/customers.write]
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CustomerApiFn.Arn}/invocations"

  GetCustomerMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CustomerApi
      ResourceId: !Ref CustomerIdResource
      HttpMethod: GET
      AuthorizationType: COGNITO_USER_POOLS
      AuthorizerId: !Ref CognitoAuthorizer
      AuthorizationScopes: [customer-api/customers.read]
      RequestParameters:
        method.request.path.customerId: true
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CustomerApiFn.Arn}/invocations"

  ApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref CustomerApiFn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${CustomerApi}/*/*/*"

  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn: [ListCustomersMethod, CreateCustomerMethod, GetCustomerMethod]
    Properties:
      RestApiId: !Ref CustomerApi

  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      Tags:
        - Key: AppCatID
          Value: !Ref AppCatID
        - Key: Description
          Value: "Access logs for the customer API"
        - Key: ServiceName
          Value: !Ref ServiceName
        - Key: Support-Team
          Value: !Ref SupportTeam
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectName
      LogGroupName: !Sub "/aws/apigateway/${ProjectName}-customer-api/access"
