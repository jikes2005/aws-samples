    Type: AWS::IAM::Role
    Condition: CreateApiGwAccount
    Properties:
      Tags:
        - Key: AppCatID
          Value: !Ref AppCatID
        - Key: Description
          Value: "API Gateway account logging role"
        - Key: ServiceName
          Value: !Ref ServiceName
        - Key: Support-Team
          Value: !Ref SupportTeam
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectName
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: apigateway.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonAPIGatewayPushToCloudWatchLogs

  ApiGatewayAccount:
    Type: AWS::ApiGateway::Account
    Condition: CreateApiGwAccount
    Properties:
      CloudWatchRoleArn: !GetAtt ApiGatewayCloudWatchRole.Arn

  ApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      Tags:
        - Key: AppCatID
          Value: !Ref AppCatID
        - Key: Description
          Value: "Customer API stage"
        - Key: ServiceName
          Value: !Ref ServiceName
        - Key: Support-Team
          Value: !Ref SupportTeam
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectName
        - Key: ApplyCommonWaf
          Value: "true"   # literal on purpose: set "true" or "false"
      RestApiId: !Ref CustomerApi
      DeploymentId: !Ref ApiDeployment
      StageName: !Ref StageName
      TracingEnabled: true
      AccessLogSetting:
        DestinationArn: !GetAtt ApiAccessLogGroup.Arn
        Format: >-
          {"requestId":"$context.requestId","extendedRequestId":"$context.extendedRequestId",
          "requestTime":"$context.requestTime","httpMethod":"$context.httpMethod",
          "resourcePath":"$context.resourcePath","path":"$context.path","status":"$context.status",
          "protocol":"$context.protocol","responseLength":"$context.responseLength",
          "responseLatency":"$context.responseLatency","integrationLatency":"$context.integrationLatency",
          "sourceIp":"$context.identity.sourceIp","vpceId":"$context.identity.vpceId",
          "clientId":"$context.authorizer.claims.client_id","scope":"$context.authorizer.claims.scope",
          "xrayTraceId":"$context.xrayTraceId","errorMessage":"$context.error.message",
          "authorizerError":"$context.authorizer.error"}
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          MetricsEnabled: true
          DataTraceEnabled: false

  # =====================================================================
  # MCP tool Lambda (Gateway target) - Cognito M2M token -> private API
  # =====================================================================
  ToolFnRole:
    Type: AWS::IAM::Role
    Properties:
      Tags:
        - Key: AppCatID
          Value: !Ref AppCatID
        - Key: Description
          Value: "Role for the MCP tool Lambda"
        - Key: ServiceName
          Value: !Ref ServiceName
        - Key: Support-Team
          Value: !Ref SupportTeam
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectName
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: read-app-client-secret
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Secret is read from Cognito at cold start - never stored in env vars,
              # templates, stack outputs or Secrets Manager.
              - Effect: Allow
                Action: cognito-idp:DescribeUserPoolClient
                Resource: !GetAtt UserPool.Arn
              - Sid: DecryptEnvVars
                Effect: Allow
                Action: kms:Decrypt
                Resource: !If [CreateKmsKey, !GetAtt KmsKey.Arn, !Ref ExistingKmsKeyArn]

  ToolFnLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      Tags:
        - Key: AppCatID
          Value: !Ref AppCatID
        - Key: Description
          Value: "Logs for the MCP tool Lambda"
        - Key: ServiceName
          Value: !Ref ServiceName
        - Key: Support-Team
          Value: !Ref SupportTeam
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectName
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-customer-tools"
      RetentionInDays: 14
      KmsKeyId: !If [CreateKmsKey, !GetAtt KmsKey.Arn, !Ref ExistingKmsKeyArn]

  ToolFn:
    Type: AWS::Lambda::Function
    DependsOn: ToolFnLogGroup
    Properties:
      Tags:
        - Key: AppCatID
          Value: !Ref AppCatID
        - Key: Description
          Value: "MCP tool - calls the customer API"
        - Key: ServiceName
          Value: !Ref ServiceName
        - Key: Support-Team
          Value: !Ref SupportTeam
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectName
      FunctionName: !Sub "${ProjectName}-customer-tools"
      Runtime: python3.12
      Architectures: [arm64]
      Handler: index.handler
      Timeout: 15
      MemorySize: 256
      Role: !GetAtt ToolFnRole.Arn
      KmsKeyArn: !If [CreateKmsKey, !GetAtt KmsKey.Arn, !Ref ExistingKmsKeyArn]
      VpcConfig:
        SubnetIds: !Ref PrivateSubnetIds
        SecurityGroupIds: [!Ref WorkloadSecurityGroup]
      Environment:
        Variables:
          API_BASE_URL: !Sub "https://${CustomerApi}.execute-api.${AWS::Region}.amazonaws.com/${ApiStage}"
          USER_POOL_ID: !Ref UserPool
          CLIENT_ID: !Ref CognitoM2MClient
          TOKEN_SCOPES: customer-api/customers.read customer-api/customers.write
      Code:
        ZipFile: |
          import json, os, time, urllib.request, urllib.error, urllib.parse
          import boto3

          BASE = os.environ["API_BASE_URL"].rstrip("/")
          REGION = os.environ["AWS_REGION"]
          POOL_ID, CLIENT_ID = os.environ["USER_POOL_ID"], os.environ["CLIENT_ID"]
          SCOPES = os.environ["TOKEN_SCOPES"].split()
          # Regional cognito-idp hostname -> resolves to the cognito-idp VPC endpoint (private DNS)
          IDP_URL = f"https://cognito-idp.{REGION}.amazonaws.com/"
          DELIM = "___"  # Gateway sends "<targetName>___<toolName>"

          _secret = None
          _token = {"value": None, "exp": 0}

          def _client_secret():
              global _secret
              if _secret is None:
                  idp = boto3.client("cognito-idp")
                  _secret = idp.describe_user_pool_client(
                      UserPoolId=POOL_ID, ClientId=CLIENT_ID)["UserPoolClient"]["ClientSecret"]
              return _secret

          def _access_token():
              # Cognito GetClientToken: M2M token without a user pool domain (works over
              # PrivateLink, unlike /oauth2/token). Raw JSON call so it doesn't depend on
              # the Lambda runtime's bundled boto3 version. Not SigV4 - auth is id+secret.
              if _token["value"] and time.time() < _token["exp"] - 60:
                  return _token["value"]
              req = urllib.request.Request(
                  IDP_URL, method="POST",
                  data=json.dumps({"ClientId": CLIENT_ID, "Secret": _client_secret(), "Scopes": SCOPES}).encode(),
                  headers={"Content-Type": "application/x-amz-json-1.1",
                           "X-Amz-Target": "AWSCognitoIdentityProviderService.GetClientToken"})
              with urllib.request.urlopen(req, timeout=5) as r:
                  res = json.loads(r.read())["ClientAuthenticationResult"]
              _token.update(value=res["AccessToken"], exp=time.time() + int(res["ExpiresIn"]))
              return _token["value"]

          def _call(method, path, body=None, query=None):
              url = BASE + path
              if query:
                  q = {k: v for k, v in query.items() if v}
                  if q:
                      url += "?" + urllib.parse.urlencode(q)
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request(url, data=data, method=method, headers={
                  "Content-Type": "application/json",
                  "Authorization": f"Bearer {_access_token()}"})
              try:
                  with urllib.request.urlopen(req, timeout=10) as r:
                      return {"status": r.status, "data": json.loads(r.read() or b"{}")}
              except urllib.error.HTTPError as e:
                  if e.code == 401:
                      _token["value"] = None  # force refresh next call
                  try:
                      err = json.loads(e.read() or b"{}")
                  except ValueError:
                      err = {"message": e.reason}
                  return {"status": e.code, "error": err}

          def handler(event, context):
              cc = getattr(context, "client_context", None)
              full = (cc.custom or {}).get("bedrockAgentCoreToolName", "") if cc else ""
              tool = full.split(DELIM, 1)[-1]
              print(json.dumps({"tool": tool, "args": event}))

              if tool == "list_customers":
                  return _call("GET", "/customers", query={k: event.get(k) for k in ("status", "segment", "province")})
              if tool == "get_customer":
                  cid = urllib.parse.quote(str(event.get("customerId", "")), safe="")
                  return _call("GET", f"/customers/{cid}")
              if tool == "create_customer":
                  allowed = ("firstName", "lastName", "email", "segment", "city", "province")
                  return _call("POST", "/customers", body={k: event[k] for k in allowed if k in event})
              return {"status": 400, "error": {"message": f"Unknown tool '{tool}'"}}

  # =====================================================================
  # AgentCore Gateway (MCP)
  # =====================================================================
  GatewayRole:
    Type: AWS::IAM::Role
    Properties:
      Tags:
        - Key: AppCatID
          Value: !Ref AppCatID
        - Key: Description
          Value: "AgentCore Gateway service role"
        - Key: ServiceName
          Value: !Ref ServiceName
        - Key: Support-Team
          Value: !Ref SupportTeam
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectName
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: bedrock-agentcore.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { aws:SourceAccount: !Ref AWS::AccountId }
      Policies:
        - PolicyName: invoke-tool-lambda
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # ARN built from the function name (not !GetAtt) to avoid a cycle:
              # KMS key policy -> GatewayRole -> ToolFn -> KMS key
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${ProjectName}-customer-tools"

  # The gateway encrypts its configuration with the CMK using its service role.
  # Granted in IAM: a key-policy grant with kms:ViaService/encryption-context
  # conditions was rejected at create time ("no identity-based policy allows").
  GatewayKmsPolicy:
    Type: AWS::IAM::RolePolicy
    Properties:
      RoleName: !Ref GatewayRole
      PolicyName: use-stack-cmk
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: [kms:DescribeKey, kms:Decrypt, kms:GenerateDataKey, kms:CreateGrant]
            Resource: !If [CreateKmsKey, !GetAtt KmsKey.Arn, !Ref ExistingKmsKeyArn]

  McpGateway:
    Type: AWS::BedrockAgentCore::Gateway
    DependsOn: GatewayKmsPolicy
    Properties:
      Tags:
        AppCatID: !Ref AppCatID
        Description: "AgentCore MCP gateway for customer tools"
        ServiceName: !Ref ServiceName
        Support-Team: !Ref SupportTeam
        Environment: !Ref Environment
        Project: !Ref ProjectName
      Name: !Sub "${ProjectName}-gw"
      Description: MCP gateway exposing customer API tools
      ProtocolType: MCP
      AuthorizerType: AWS_IAM
      RoleArn: !GetAtt GatewayRole.Arn
      KmsKeyArn: !If [CreateKmsKey, !GetAtt KmsKey.Arn, !Ref ExistingKmsKeyArn]
      ExceptionLevel: DEBUG   # POC only - remove for anything beyond a POC

  CustomerToolsTarget:
    Type: AWS::BedrockAgentCore::GatewayTarget
    Properties:
      GatewayIdentifier: !GetAtt McpGateway.GatewayIdentifier
      Name: customer-tools
      Description: Customer API (GET/POST) via Lambda
      CredentialProviderConfigurations:
        - CredentialProviderType: GATEWAY_IAM_ROLE
      TargetConfiguration:
        Mcp:
          Lambda:
            LambdaArn: !GetAtt ToolFn.Arn
            ToolSchema:
              InlinePayload:
                - Name: list_customers
                  Description: List customers, optionally filtered by status, segment or province.
                  InputSchema:
                    Type: object
                    Properties:
                      status:
                        Type: string
                        Description: ACTIVE, DORMANT or PENDING_KYC
                      segment:
                        Type: string
                        Description: RETAIL, SMALL_BUSINESS or WEALTH
                      province:
                        Type: string
                        Description: Two-letter Canadian province code, e.g. ON
                - Name: get_customer
                  Description: Get a single customer's profile and accounts by customer ID (e.g. C-1001).
                  InputSchema:
                    Type: object
                    Properties:
                      customerId:
                        Type: string
                        Description: Customer ID, format C-XXXX
                    Required: [customerId]
                - Name: create_customer
                  Description: Create (onboard) a new customer. Returns the new customer with status PENDING_KYC.
                  InputSchema:
                    Type: object
                    Properties:
                      firstName: { Type: string }
                      lastName: { Type: string }
                      email: { Type: string }
                      segment:
                        Type: string
                        Description: RETAIL (default), SMALL_BUSINESS or WEALTH
                      city: { Type: string }
                      province: { Type: string }
                    Required: [firstName, lastName, email]

  # =====================================================================
  # AgentCore Runtime (Strands agent, VPC mode)
  # =====================================================================
  RuntimeRole:
    Type: AWS::IAM::Role
    Properties:
      Tags:
        - Key: AppCatID
          Value: !Ref AppCatID
        - Key: Description
          Value: "AgentCore Runtime execution role"
        - Key: ServiceName
          Value: !Ref ServiceName
        - Key: Support-Team
          Value: !Ref SupportTeam
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectName
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: bedrock-agentcore.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { aws:SourceAccount: !Ref AWS::AccountId }
              ArnLike:
                aws:SourceArn: !Sub "arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:*"
      Policies:
        - PolicyName: agent-runtime
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Bedrock
                Effect: Allow
                Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
                Resource:
                  - !Sub "arn:${AWS::Partition}:bedrock:*::foundation-model/*"
                  # System cross-region profiles (us./global.) may be addressed with or without an account ID
                  - !Sub "arn:${AWS::Partition}:bedrock:*:*:inference-profile/*"
              - Sid: InvokeGateway
                Effect: Allow
                Action: bedrock-agentcore:InvokeGateway
                Resource: !GetAtt McpGateway.GatewayArn
              - Sid: AgentCode
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:${AWS::Partition}:s3:::${ArtifactBucket}/${AgentCodeKey}"
              - Sid: Logs
                Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents, logs:DescribeLogStreams, logs:DescribeLogGroups]
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/runtimes/*"
              - Sid: Observability
                Effect: Allow
                Action: [xray:PutTraceSegments, xray:PutTelemetryRecords, cloudwatch:PutMetricData]
                Resource: "*"
                Condition:
                  StringEqualsIfExists: { cloudwatch:namespace: bedrock-agentcore }

  AgentRuntime:
    Type: AWS::BedrockAgentCore::Runtime
    # Name comes from RuntimeLogCleanup, so that resource is created before the runtime
    # and deleted after it - the log group is removed once the runtime is gone.
    Properties:
      Tags:
        AppCatID: !Ref AppCatID
        Description: "Strands customer agent"
        ServiceName: !Ref ServiceName
        Support-Team: !Ref SupportTeam
        Environment: !Ref Environment
        Project: !Ref ProjectName
      AgentRuntimeName: !GetAtt RuntimeLogCleanup.RuntimeName
      Description: Strands agent calling customer API tools through AgentCore Gateway (MCP)
      RoleArn: !GetAtt RuntimeRole.Arn
      ProtocolConfiguration: HTTP
      AgentRuntimeArtifact:
        CodeConfiguration:
          Runtime: PYTHON_3_12
          EntryPoint: [customer_agent.py]
          Code:
            S3:
              Bucket: !Ref ArtifactBucket
              Prefix: !Ref AgentCodeKey
      NetworkConfiguration:
        NetworkMode: VPC
        NetworkModeConfig:
          Subnets: !Ref PrivateSubnetIds
          SecurityGroups: [!Ref WorkloadSecurityGroup]
      EnvironmentVariables:
        GATEWAY_URL: !GetAtt McpGateway.GatewayUrl
        MODEL_ID: !Ref ModelId
        AWS_REGION_NAME: !Ref AWS::Region

  # =====================================================================
  # Agent test Lambda - invoke it to exercise the deployed agent end to end
  #   {}                          -> runs the built-in test suite
  #   {"prompt": "..."}           -> asks one question
  #   {"prompts": ["...", ...]}   -> asks several questions
  # =====================================================================
  AgentTestFnRole:
    Type: AWS::IAM::Role
    Properties:
      Tags:
        - Key: AppCatID
          Value: !Ref AppCatID
        - Key: Description
          Value: "Role for the agent test Lambda"
        - Key: ServiceName
          Value: !Ref ServiceName
        - Key: Support-Team
          Value: !Ref SupportTeam
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectName
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: invoke-agent
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: bedrock-agentcore:InvokeAgentRuntime
                Resource:
                  - !GetAtt AgentRuntime.AgentRuntimeArn
                  - !Sub "${AgentRuntime.AgentRuntimeArn}/runtime-endpoint/*"
              - Sid: DecryptEnvVars
                Effect: Allow
                Action: kms:Decrypt
                Resource: !If [CreateKmsKey, !GetAtt KmsKey.Arn, !Ref ExistingKmsKeyArn]

  AgentTestFnLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      Tags:
        - Key: AppCatID
          Value: !Ref AppCatID
        - Key: Description
          Value: "Logs for the agent test Lambda"
        - Key: ServiceName
          Value: !Ref ServiceName
        - Key: Support-Team
          Value: !Ref SupportTeam
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectName
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-agent-test"
      RetentionInDays: 14
      KmsKeyId: !If [CreateKmsKey, !GetAtt KmsKey.Arn, !Ref ExistingKmsKeyArn]

  AgentTestFn:
    Type: AWS::Lambda::Function
    DependsOn: AgentTestFnLogGroup
    Properties:
      Tags:
        - Key: AppCatID
          Value: !Ref AppCatID
        - Key: Description
          Value: "Invokes the agent to test it end to end"
        - Key: ServiceName
          Value: !Ref ServiceName
        - Key: Support-Team
          Value: !Ref SupportTeam
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectName
      FunctionName: !Sub "${ProjectName}-agent-test"
      Description: Invokes the AgentCore Runtime agent with test prompts and checks the answers
      Runtime: python3.12
      Architectures: [arm64]
      Handler: index.handler
      Timeout: 600
      MemorySize: 256
      Role: !GetAtt AgentTestFnRole.Arn
      KmsKeyArn: !If [CreateKmsKey, !GetAtt KmsKey.Arn, !Ref ExistingKmsKeyArn]
      VpcConfig: !If
        - TestFnInVpc
        - SubnetIds: !Ref PrivateSubnetIds
          SecurityGroupIds: [!Ref WorkloadSecurityGroup]
        - !Ref AWS::NoValue
      Environment:
        Variables:
          AGENT_RUNTIME_ARN: !GetAtt AgentRuntime.AgentRuntimeArn
          QUALIFIER: DEFAULT
      Code:
        ZipFile: |
          import json, os, time, uuid, urllib.parse, urllib.request
          import boto3
          from botocore.auth import SigV4Auth
          from botocore.awsrequest import AWSRequest
          from botocore.config import Config
          from botocore.exceptions import UnknownServiceError

          ARN = os.environ["AGENT_RUNTIME_ARN"]
          QUALIFIER = os.environ.get("QUALIFIER", "DEFAULT")
          REGION = os.environ["AWS_REGION"]
          session = boto3.Session()

          # Use the SDK client when the Lambda runtime's boto3 includes bedrock-agentcore;
          # otherwise fall back to a SigV4-signed HTTPS call (same API, any boto3 version).
          try:
              client = session.client("bedrock-agentcore", config=Config(
                  connect_timeout=10, read_timeout=280, retries={"max_attempts": 1}))
          except UnknownServiceError:
              client = None
              print("boto3 has no bedrock-agentcore client - using signed HTTPS requests")

          def _invoke_raw(session_id, payload):
              url = (f"https://bedrock-agentcore.{REGION}.amazonaws.com/runtimes/"
                     f"{urllib.parse.quote(ARN, safe='')}/invocations?qualifier={QUALIFIER}")
              headers = {"Content-Type": "application/json", "Accept": "application/json",
                         "X-Amzn-Bedrock-AgentCore-Runtime-Session-Id": session_id}
              req = AWSRequest(method="POST", url=url, data=payload, headers=headers)
              SigV4Auth(session.get_credentials().get_frozen_credentials(), "bedrock-agentcore", REGION).add_auth(req)
              http = urllib.request.Request(url, data=payload, method="POST", headers=dict(req.headers))
              with urllib.request.urlopen(http, timeout=280) as r:
                  return r.headers.get("Content-Type", ""), r.read()

          # Built-in suite against the seeded sample data. A check passes when the answer
          # contains any of the expected strings (case-insensitive). Built per call so the
          # "create" case always uses a fresh email (a reused one would hit the 409 duplicate check).
          def suite():
              return [
                  {"name": "list with filter", "prompt": "List the active customers in Ontario.",
                   "expect_any": ["C-1001", "Alice"]},
                  {"name": "get by id", "prompt": "What accounts does customer C-1002 have and what is the total balance?",
                   "expect_any": ["61,234", "61234"]},
                  {"name": "not found", "prompt": "Show me customer C-9999.",
                   "expect_any": ["not found", "doesn't exist", "does not exist", "no customer", "couldn't find", "could not find"]},
                  {"name": "create", "prompt": f"Onboard a new retail customer: Test User, test.user.{uuid.uuid4().hex[:6]}@example.com, Ottawa ON.",
                   "expect_any": ["PENDING_KYC", "pending KYC"]},
              ]

          def ask(prompt, session_id=None):
              session_id = session_id or f"agent-test-{uuid.uuid4()}"     # must be >= 33 chars
              t0 = time.time()
              payload = json.dumps({"prompt": prompt}).encode()
              if client:
                  resp = client.invoke_agent_runtime(agentRuntimeArn=ARN, qualifier=QUALIFIER,
                                                     runtimeSessionId=session_id, payload=payload)
                  ctype, body = resp.get("contentType", ""), resp["response"].read()
              else:
                  ctype, body = _invoke_raw(session_id, payload)
              raw = body.decode("utf-8", "replace")
              text = raw
              if "text/event-stream" in ctype:
                  text = "".join(l[5:].strip() for l in raw.splitlines() if l.startswith("data:"))
              try:
                  text = json.loads(text).get("result", text)
              except (ValueError, AttributeError):
                  pass
              return {"answer": text, "seconds": round(time.time() - t0, 1), "sessionId": session_id}

          def handler(event, context):
              event = event or {}
              if event.get("prompt"):
                  cases = [{"name": "custom", "prompt": event["prompt"]}]
              elif event.get("prompts"):
                  cases = [{"name": f"custom-{i + 1}", "prompt": p} for i, p in enumerate(event["prompts"])]
              else:
                  cases = suite()
              results = []
              for c in cases:
                  if context.get_remaining_time_in_millis() < 60_000:
                      results.append({"name": c["name"], "status": "SKIPPED", "reason": "out of time"})
                      continue
                  try:
                      r = ask(c["prompt"], event.get("sessionId"))
                      exp = c.get("expect_any")
                      ok = None if exp is None else any(e.lower() in str(r["answer"]).lower() for e in exp)
                      status = "ANSWERED" if ok is None else ("PASS" if ok else "FAIL")
                      results.append({"name": c["name"], "status": status, "prompt": c["prompt"], **r})
                  except Exception as e:
                      results.append({"name": c["name"], "status": "ERROR", "prompt": c["prompt"],
                                      "error": f"{type(e).__name__}: {e}"})
                  print(json.dumps(results[-1])[:4000])
              summary = {s: sum(1 for r in results if r["status"] == s)
                         for s in ("PASS", "FAIL", "ERROR", "ANSWERED", "SKIPPED") if any(r["status"] == s for r in results)}
              return {"agentRuntimeArn": ARN, "summary": summary, "results": results}

Outputs:
  AgentRuntimeArn:
    Value: !GetAtt AgentRuntime.AgentRuntimeArn
  GatewayUrl:
    Value: !GetAtt McpGateway.GatewayUrl
  CustomerApiId:
    Value: !Ref CustomerApi
  CustomerApiBaseUrl:
    Description: Resolves only inside the VPC (execute-api private DNS)
    Value: !Sub "https://${CustomerApi}.execute-api.${AWS::Region}.amazonaws.com/${ApiStage}"
  CustomersTableName:
    Value: !Ref CustomersTable
  UserPoolId:
    Value: !Ref UserPool
  ToolsAppClientId:
    Value: !Ref CognitoM2MClient
  ToolFunctionName:
    Value: !Ref ToolFn
  AgentTestFunctionName:
    Description: Invoke with {} for the test suite, or {"prompt":"..."} for one question
    Value: !Ref AgentTestFn
  KmsKeyArn:
    Description: Customer managed key used by this stack
    Value: !If [CreateKmsKey, !GetAtt KmsKey.Arn, !Ref ExistingKmsKeyArn]
  OnDemandBackupArn:
    Value: !Ref OnDemandBackup
  ApiAccessLogGroup:
    Value: !Ref ApiAccessLogGroup
  WorkloadSecurityGroupId:
    Description: Workload SG. Endpoint SGs should allow 443 from the VPC range (172.16.0.0/20), not reference this SG (a reference blocks stack deletion)
    Value: !Ref WorkloadSecurityGroup
